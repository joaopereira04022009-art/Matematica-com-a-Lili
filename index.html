<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura Matemática - 5º Ano 🚀</title>
    <!-- Tailwind CSS para um design moderno -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4">

    <!-- Container Principal da SPA -->
    <div id="app" class="bg-white w-full max-w-xl rounded-3xl shadow-2xl p-6 md:p-8 text-slate-800 transition-all duration-300">
        
        <!-- TELA 1: BOAS-VINDAS -->
        <div id="welcome-screen" class="text-center space-y-6">
            <div class="inline-block bg-indigo-100 p-4 rounded-full text-4xl">
                🧠✨
            </div>
            <h1 class="text-3xl font-bold text-indigo-600">Desafio Matemágico!</h1>
            <p class="text-slate-600">
                Olá, futuro(a) cientista! Você está pronto(a) para testar seus superpoderes de matemática com 5 desafios incríveis do 5º ano?
            </p>
            <button onclick="startQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-transform transform hover:scale-105 cursor-pointer">
                Começar Aventura! 🚀
            </button>
        </div>

        <!-- TELA 2: QUIZ / DESAFIOS (Oculto inicialmente) -->
        <div id="quiz-screen" class="hidden space-y-6">
            <!-- Barra de Progresso e Pontuação -->
            <div class="flex justify-between items-center text-sm font-semibold text-slate-500 border-b pb-3">
                <span id="question-counter">Desafio 1 de 5</span>
                <span id="score-display" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">Pontos: 0</span>
            </div>

            <!-- Pergunta -->
            <div class="space-y-2">
                <h2 id="challenge-title" class="text-xl font-bold text-indigo-900"></h2>
                <p id="challenge-question" class="text-slate-700 text-base md:text-lg leading-relaxed bg-slate-50 p-4 rounded-2xl border border-slate-100"></p>
            </div>

            <!-- Opções de Resposta -->
            <div id="options-container" class="space-y-3">
                <!-- Gerado via JavaScript -->
            </div>

            <!-- Feedback Instantâneo -->
            <div id="feedback-box" class="hidden p-4 rounded-xl text-center font-semibold text-sm"></div>

            <!-- Botão Próximo -->
            <button id="next-btn" onclick="nextQuestion()" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition-all cursor-pointer">
                Próximo Desafio ➡️
            </button>
        </div>

        <!-- TELA 3: RESULTADO FINAL (Oculto inicialmente) -->
        <div id="result-screen" class="hidden text-center space-y-6">
            <div class="text-5xl" id="result-emoji">🏆</div>
            <h2 class="text-2xl font-bold text-indigo-900">Missão Cumprida!</h2>
            <p id="result-message" class="text-slate-600 text-lg"></p>
            <div class="bg-indigo-50 p-4 rounded-2xl">
                <span class="text-sm text-slate-500">Sua pontuação final:</span>
                <div id="final-score" class="text-4xl font-extrabold text-indigo-600 mt-1"></div>
            </div>
            <button onclick="restartQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-transform transform hover:scale-105 cursor-pointer">
                Jogar Novamente 🔄
            </button>
        </div>

    </div>

    <!-- Script da Aplicação -->
    <script>
        // Banco de Dados com 5 Desafios do 5º Ano
        const challenges = [
            {
                title: "Desafio 1: Compras no Supermercado 🛒",
                question: "João comprou 3 cadernos por R$ 7,50 cada. Ele pagou com uma nota de R$ 50,00. Quanto João recebeu de troco?",
                options: ["R$ 27,50", "R$ 22,50", "R$ 32,50", "R$ 25,00"],
                answer: "R$ 27,50"
            },
            {
                title: "Desafio 2: Frações Deliciosas 🍕",
                question: "Uma pizza foi dividida em 8 pedaços iguais. Ana comeu 3 pedaços. Qual fração da pizza sobrou?",
                options: ["3/8", "5/8", "8/5", "1/2"],
                answer: "5/8"
            },
            {
                title: "Desafio 3: Geometria Divertida 📐",
                question: "Qual é a área de um campo retangular que mede 10 metros de largura e 25 metros de comprimento?",
                options: ["35 metros quadrados", "70 metros quadrados", "250 metros quadrados", "100 metros quadrados"],
                answer: "250 metros quadrados"
            },
            {
                title: "Desafio 4: Operações com Decimais ⚖️",
                question: "Quanto é 45,50 somado com 12,30?",
                options: ["57,80", "56,70", "58,80", "57,70"],
                answer: "57,80"
            },
            {
                title: "Desafio 5: Sequência Secreta 🔢",
                question: "Descubra o padrão e diga qual é o próximo número da sequência: 5, 10, 20, 40, ...",
                options: ["60", "80", "50", "100"],
                answer: "80"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const welcomeScreen = document.getElementById("welcome-screen");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        
        const questionCounter = document.getElementById("question-counter");
        const scoreDisplay = document.getElementById("score-display");
        const challengeTitle = document.getElementById("challenge-title");
        const challengeQuestion = document.getElementById("challenge-question");
        const optionsContainer = document.getElementById("options-container");
        const feedbackBox = document.getElementById("feedback-box");
        const nextBtn = document.getElementById("next-btn");

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            welcomeScreen.classList.add("hidden");
            resultScreen.classList.add("hidden");
            quizScreen.classList.remove("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            feedbackBox.classList.add("hidden");
            nextBtn.classList.add("hidden");

            const current = challenges[currentQuestionIndex];
            questionCounter.innerText = `Desafio ${currentQuestionIndex + 1} de ${challenges.length}`;
            scoreDisplay.innerText = `Pontos: ${score}`;
            challengeTitle.innerText = current.title;
            challengeQuestion.innerText = current.question;

            optionsContainer.innerHTML = "";
            current.options.forEach(option => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 transition-all font-medium text-slate-700 cursor-pointer";
                btn.innerText = option;
                btn.onclick = () => selectOption(btn, option, current.answer);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(buttonElement, selectedOption, correctAnswer) {
            if (answered) return;
            answered = true;

            const allButtons = optionsContainer.querySelectorAll("button");
            
            allButtons.forEach(btn => {
                btn.disabled = true;
                if (btn.innerText === correctAnswer) {
                    btn.classList.remove("border-slate-200", "hover:border-indigo-500", "hover:bg-indigo-50");
                    btn.classList.add("bg-emerald-100", "border-emerald-500", "text-emerald-800");
                }
            });

            if (selectedOption === correctAnswer) {
                score += 20; // 5 perguntas * 20 = 100 pontos no total
                scoreDisplay.innerText = `Pontos: ${score}`;
                feedbackBox.className = "p-4 rounded-xl text-center font-semibold text-sm bg-emerald-100 text-emerald-800";
                feedbackBox.innerText = "🎉 Resposta Correta! Mandou muito bem!";
            } else {
                buttonElement.classList.remove("border-slate-200", "hover:border-indigo-500", "hover:bg-indigo-50");
                buttonElement.classList.add("bg-rose-100", "border-rose-500", "text-rose-800");
                feedbackBox.className = "p-4 rounded-xl text-center font-semibold text-sm bg-rose-100 text-rose-800";
                feedbackBox.innerText = `❌ Ops! A resposta correta era: ${correctAnswer}`;
            }

            feedbackBox.classList.remove("hidden");
            nextBtn.classList.remove("hidden");
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < challenges.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.add("hidden");
            resultScreen.classList.remove("hidden");
            
            document.getElementById("final-score").innerText = `${score} / 100`;
            const resultEmoji = document.getElementById("result-emoji");
            const resultMessage = document.getElementById("result-message");

            if (score === 100) {
                resultEmoji.innerText = "👑🏆";
                resultMessage.innerText = "Incrível! Você gabaritou e é um verdadeiro Mestre da Matemática!";
            } else if (score >= 60) {
                resultEmoji.innerText = "🌟👏";
                resultMessage.innerText = "Muito bom! Você foi super bem nos desafios, continue praticando!";
            } else {
                resultEmoji.innerText = "💡💪";
                resultMessage.innerText = "Bom esforço! Que tal tentar de novo para melhorar sua pontuação?";
            }
        }

        function restartQuiz() {
            startQuiz();
        }
    </script>
</body>
</html>
